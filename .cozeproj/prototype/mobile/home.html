<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      --color-primary:              #10b981;
      --color-primary-container:    #064e3b;
      --color-on-primary:           #ffffff;
      --color-background:                 #0f172a;
      --color-surface-container-lowest:   #020617;
      --color-surface:                    #0f172a;
      --color-surface-container:          #1e293b;
      --color-surface-container-high:     #334155;
      --color-surface-container-highest:  #475569;
      --color-on-surface:           #f1f5f9;
      --color-on-surface-variant:   #94a3b8;
      --color-success:  #22c55e;
      --color-error:    #ef4444;
      --color-warning:  #f59e0b;
      --color-outline:          #475569;
      --color-outline-variant:  #334155;
      --radius-sm:   0.25rem;
      --radius-md:   0.375rem;
      --radius-lg:   0.5rem;
      --radius-xl:   0.75rem;
      --radius-2xl:  1rem;
      --radius-full: 9999px;
      --shadow-card:   0 4px 12px rgba(0,0,0,0.15);
      --shadow-float:  0 10px 25px rgba(0,0,0,0.25);
      --shadow-dialog: 0 25px 50px rgba(0,0,0,0.4);
      --font-sans: "Inter", "Noto Sans SC", system-ui, sans-serif;
    }
  </style>

  <style>
    body {
      min-height: max(812px, 100dvh);
      font-family: system-ui, sans-serif;
    }
    .tabular { font-variant-numeric: tabular-nums; }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }
    .live-dot { animation: pulse-dot 1.6s ease-in-out infinite; }
  </style>
</head>

<body class="bg-background text-on-surface font-sans">

  <!-- 顶部 Header（一级页无返回） -->
  <header class="bg-background sticky top-0 z-40 h-14 flex items-center justify-between px-4">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-md bg-primary/15 flex items-center justify-center">
        <i data-lucide="line-chart" class="w-4 h-4 text-primary"></i>
      </div>
      <h1 class="text-base font-semibold text-on-surface">Agent 量化</h1>
    </div>
    <button class="w-10 h-10 flex items-center justify-center text-on-surface-variant rounded-full hover:bg-surface-container transition-colors">
      <i data-lucide="bell" class="w-5 h-5"></i>
    </button>
  </header>

  <!-- @main-content:start -->
  <main class="overflow-y-auto pb-[calc(3.5rem+env(safe-area-inset-bottom))]">
    <div class="px-4 pt-2 pb-6 space-y-6">

      <!-- 模拟盘总览卡片 -->
      <section class="bg-surface-container rounded-2xl p-5 shadow-card">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <span class="text-xs uppercase tracking-wider text-on-surface-variant">模拟盘总资产</span>
            <!-- ✅ 本轮新增：实时行情来源徽标 -->
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-primary/15 text-primary text-[10px] font-semibold">
              <span class="w-1.5 h-1.5 rounded-full bg-primary live-dot"></span>
              实时行情
            </span>
          </div>
          <span class="text-xs text-on-surface-variant tabular">14:32:08</span>
        </div>
        <div class="flex items-baseline gap-2 mb-2">
          <span class="text-3xl font-bold tabular text-on-surface">¥128,346.21</span>
        </div>
        <div class="flex items-center gap-2 text-sm">
          <span class="text-success font-semibold tabular">+¥1,238.55</span>
          <span class="text-success font-semibold tabular">+0.97%</span>
          <span class="text-on-surface-variant text-xs">今日</span>
        </div>
      </section>

      <!-- 快捷操作 -->
      <section class="grid grid-cols-3 gap-3">
        <button class="bg-surface-container rounded-xl py-4 flex flex-col items-center gap-1.5 hover:bg-surface-container-high transition-colors">
          <i data-lucide="flask-conical" class="w-5 h-5 text-primary"></i>
          <span class="text-xs font-medium text-on-surface">策略回测</span>
        </button>
        <button class="bg-surface-container rounded-xl py-4 flex flex-col items-center gap-1.5 hover:bg-surface-container-high transition-colors">
          <i data-lucide="bot" class="w-5 h-5 text-primary"></i>
          <span class="text-xs font-medium text-on-surface">Agent 分析</span>
        </button>
        <button class="bg-surface-container rounded-xl py-4 flex flex-col items-center gap-1.5 hover:bg-surface-container-high transition-colors">
          <i data-lucide="history" class="w-5 h-5 text-primary"></i>
          <span class="text-xs font-medium text-on-surface">交易明细</span>
        </button>
      </section>

      <!-- 持仓列表 -->
      <section>
        <div class="flex items-center justify-between mb-3 px-1">
          <h2 class="text-base font-semibold text-on-surface">当前持仓</h2>
          <a href="#" class="text-xs text-on-surface-variant flex items-center gap-0.5">
            全部 <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </a>
        </div>

        <div class="space-y-2">
          <!-- 持仓 1 -->
          <article class="bg-surface-container rounded-xl p-4 flex items-center justify-between">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1">
                <h3 class="text-base font-semibold text-on-surface">紫光股份</h3>
                <span class="text-xs text-on-surface-variant tabular">000938</span>
              </div>
              <div class="flex items-center gap-2 text-xs">
                <span class="text-on-surface-variant">持仓 1000 股</span>
                <span class="text-on-surface-variant/50">·</span>
                <span class="text-on-surface-variant tabular">成本 22.15</span>
              </div>
            </div>
            <div class="text-right">
              <div class="text-base font-semibold tabular text-on-surface">23.42</div>
              <div class="text-xs font-semibold tabular text-success">+5.73%</div>
            </div>
          </article>

          <!-- 持仓 2 -->
          <article class="bg-surface-container rounded-xl p-4 flex items-center justify-between">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1">
                <h3 class="text-base font-semibold text-on-surface">中国平安</h3>
                <span class="text-xs text-on-surface-variant tabular">601318</span>
              </div>
              <div class="flex items-center gap-2 text-xs">
                <span class="text-on-surface-variant">持仓 500 股</span>
                <span class="text-on-surface-variant/50">·</span>
                <span class="text-on-surface-variant tabular">成本 48.30</span>
              </div>
            </div>
            <div class="text-right">
              <div class="text-base font-semibold tabular text-on-surface">46.85</div>
              <div class="text-xs font-semibold tabular text-error">-3.00%</div>
            </div>
          </article>

          <!-- 持仓 3 -->
          <article class="bg-surface-container rounded-xl p-4 flex items-center justify-between">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1">
                <h3 class="text-base font-semibold text-on-surface">宁德时代</h3>
                <span class="text-xs text-on-surface-variant tabular">300750</span>
              </div>
              <div class="flex items-center gap-2 text-xs">
                <span class="text-on-surface-variant">持仓 200 股</span>
                <span class="text-on-surface-variant/50">·</span>
                <span class="text-on-surface-variant tabular">成本 195.00</span>
              </div>
            </div>
            <div class="text-right">
              <div class="text-base font-semibold tabular text-on-surface">208.50</div>
              <div class="text-xs font-semibold tabular text-success">+6.92%</div>
            </div>
          </article>
        </div>
      </section>

      <!-- 数据来源摘要入口 -->
      <section>
        <a href="profile.html" class="block bg-surface-container rounded-xl p-4 flex items-center justify-between hover:bg-surface-container-high transition-colors">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-primary/15 flex items-center justify-center">
              <i data-lucide="database" class="w-5 h-5 text-primary"></i>
            </div>
            <div>
              <div class="text-sm font-semibold text-on-surface">数据来源透明化</div>
              <div class="text-xs text-on-surface-variant mt-0.5">5 个数据源 · 全部在线</div>
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-on-surface-variant"></i>
        </a>
      </section>

    </div>
  </main>
  <!-- @main-content:end -->

  <!-- 底部 TabBar（一级页专用） -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-background
              flex justify-around items-center h-14 pb-[env(safe-area-inset-bottom)] border-t border-outline-variant/30">
    <a href="home.html" class="flex flex-col items-center gap-0.5 px-5 py-1.5 text-primary"
       aria-current="page">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold tracking-wide">首页</span>
    </a>
    <a href="backtest.html" class="flex flex-col items-center gap-0.5 px-5 py-1.5 text-on-surface-variant
                       hover:text-on-surface transition-colors">
      <i data-lucide="flask-conical" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold tracking-wide">回测</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center gap-0.5 px-5 py-1.5 text-on-surface-variant
                       hover:text-on-surface transition-colors">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold tracking-wide">我的</span>
    </a>
  </nav>

  <script>lucide.createIcons();</script>
</body>

</html>
