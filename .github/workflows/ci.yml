name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # 支持手动触发（Actions 页面 Run workflow，可随时重新部署体验版）

# 同一分支的并发运行只保留最新一次，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 依赖安装与锁文件校验（其余 job 依赖它）
  setup:
    name: Setup & Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false # 版本由 package.json 的 packageManager (pnpm@9.0.0) 决定

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm # 缓存 pnpm store（基于 pnpm-lock.yaml）

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # lint + 类型检查
  validate:
    name: Validate (lint + tsc)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validate
        run: pnpm validate

  # 后端 Jest（NestJS + better-sqlite3 原生模块）
  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    needs: setup
    env:
      # 跳过 StockService 启动时的 Sina 目录预热（e2e-flow 未自行设置 NODE_ENV）
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run server tests
        working-directory: server
        # --ci：失败即红，不进入 watch / 交互模式；--coverage：采集覆盖率并执行 coverageThreshold 门禁
        run: pnpm test -- --ci --coverage

      - name: Upload server coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-server
          path: server/coverage
          retention-days: 14

  # 前端 Jest（jsdom）
  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web tests
        # --coverage：采集覆盖率并执行 coverageThreshold 门禁（本地默认 pnpm test:web 不采集，避免拖慢）
        run: pnpm test:web --ci --coverage

      - name: Upload web coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: coverage
          retention-days: 14

  # 构建产物校验
  build:
    name: Build (server + web)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm build:server

      - name: Build web
        run: pnpm build:web

  # 微信小程序自动发布（上传体验版）
  # 前置条件：
  #   1. 仓库 Secrets 配置 WEAPP_APPID 与 WEAPP_PRIVATE_KEY（mp 后台"小程序代码上传"密钥全文）
  #   2. mp.weixin.qq.com → 开发管理 → 开发设置 → 小程序代码上传：关闭 IP 白名单
  # 说明：miniprogram-ci 只能自动到"上传体验版"，提交审核与线上发布需在 mp 后台人工确认
  publish-weapp:
    name: Publish WeApp (体验版)
    runs-on: ubuntu-latest
    needs: [validate, test-server, test-web, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write upload key
        run: |
          mkdir -p key
          printf '%s' "$WEAPP_PRIVATE_KEY" > key/private.appid.key
        env:
          WEAPP_PRIVATE_KEY: ${{ secrets.WEAPP_PRIVATE_KEY }}

      - name: Build weapp
        run: pnpm build:weapp
        env:
          TARO_APP_WEAPP_APPID: ${{ secrets.WEAPP_APPID }}

      # plugin-mini-ci 的独立 upload 命令：上传 dist/ 为体验版
      # 版本号用 run_number 自增（1.0.N），描述带 commit SHA 便于在 mp 后台追溯
      - name: Upload to WeChat
        id: upload
        run: pnpm upload:weapp
        env:
          TARO_APP_WEAPP_APPID: ${{ secrets.WEAPP_APPID }}
          TARO_UPLOAD_VERSION: 1.0.${{ github.run_number }}
          TARO_UPLOAD_DESC: "CI run #${{ github.run_number }} - ${{ github.sha }}"

      # 体验版二维码（dist/upload.png）作为 CI 产物保存，可在 Actions 页面下载扫码
      - name: Upload experience QR code
        if: steps.upload.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: weapp-experience-qrcode
          path: dist/upload.png
          retention-days: 30
          if-no-files-found: warn

      # 汇总页展示版本信息与二维码获取方式
      - name: Write job summary
        if: steps.upload.outcome == 'success'
        run: |
          {
            echo "## 微信小程序体验版发布成功"
            echo ""
            echo "- 版本号：\`1.0.${{ github.run_number }}\`"
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 体验版二维码：本页底部 Artifacts 下载 \`weapp-experience-qrcode\`，微信扫码即可体验"
            echo "- 或在 [mp.weixin.qq.com](https://mp.weixin.qq.com) → 版本管理 → 开发版本 中查看"
          } >> "$GITHUB_STEP_SUMMARY"
