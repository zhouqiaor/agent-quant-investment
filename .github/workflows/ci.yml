name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的并发运行只保留最新一次，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 依赖安装与锁文件校验（其余 job 依赖它）
  setup:
    name: Setup & Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false # 版本由 package.json 的 packageManager (pnpm@9.0.0) 决定

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm # 缓存 pnpm store（基于 pnpm-lock.yaml）

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # lint + 类型检查
  validate:
    name: Validate (lint + tsc)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validate
        run: pnpm validate

  # 后端 Jest（NestJS + better-sqlite3 原生模块）
  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    needs: setup
    env:
      # 跳过 StockService 启动时的 Sina 目录预热（e2e-flow 未自行设置 NODE_ENV）
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # better-sqlite3 预编译二进制在 ubuntu runner 上 require 即 SIGSEGV，
      # 强制从源码编译以排除预编译产物兼容性问题
      - name: Rebuild better-sqlite3 from source
        working-directory: server
        run: pnpm rebuild better-sqlite3
        env:
          npm_config_build_from_source: "true"

      # 【临时诊断】最小复现：直接 require better-sqlite3 并建内存库
      - name: Diag - minimal sqlite probe
        continue-on-error: true
        working-directory: server
        run: node -e "const D=require('better-sqlite3');const db=new D(':memory:');db.exec('CREATE TABLE t(a)');console.log('sqlite ok',db.prepare('select sqlite_version() v').get())"

      # 【临时诊断】单套件 in-band 运行（排除 Jest worker 因素），输出真实报错
      - name: Diag - single suite in band
        continue-on-error: true
        working-directory: server
        run: pnpm exec jest src/persistence/persistence.service.spec.ts --runInBand --ci 2>&1 | tail -60

      # 【临时诊断】版本矩阵探针：预编译 13.0.3 / 源码编译 13.0.3 / 旧版 12.4.1
      - name: Diag - version matrix probes
        continue-on-error: true
        run: |
          set -x
          node -p "process.version + ' ' + process.platform + ' ' + process.arch"
          ldd "$(pwd)/node_modules/.pnpm/better-sqlite3@13.0.3/node_modules/better-sqlite3/build/Release/better_sqlite3.node" || true
          cd /tmp
          rm -rf probe-a probe-b probe-c
          mkdir probe-a probe-b probe-c
          cd probe-a && npm init -y >/dev/null && npm i better-sqlite3@13.0.3 --no-audit --no-fund && node -e "console.log('prebuilt 13.0.3 ok', new (require('better-sqlite3'))(':memory:').prepare('select 1 x').get())"; echo "probe-a exit=$?"
          cd ../probe-b && npm init -y >/dev/null && npm i better-sqlite3@13.0.3 --no-audit --no-fund --build-from-source && node -e "console.log('source 13.0.3 ok', new (require('better-sqlite3'))(':memory:').prepare('select 1 x').get())"; echo "probe-b exit=$?"
          cd ../probe-c && npm init -y >/dev/null && npm i better-sqlite3@12.4.1 --no-audit --no-fund && node -e "console.log('prebuilt 12.4.1 ok', new (require('better-sqlite3'))(':memory:').prepare('select 1 x').get())"; echo "probe-c exit=$?"

      - name: Run server tests
        working-directory: server
        # --ci：失败即红，不进入 watch / 交互模式；--coverage：采集覆盖率并执行 coverageThreshold 门禁
        run: pnpm test -- --ci --coverage

      - name: Upload server coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-server
          path: server/coverage
          retention-days: 14

  # 前端 Jest（jsdom）
  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web tests
        # --coverage：采集覆盖率并执行 coverageThreshold 门禁（本地默认 pnpm test:web 不采集，避免拖慢）
        run: pnpm test:web --ci --coverage

      - name: Upload web coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: coverage
          retention-days: 14

  # 构建产物校验
  build:
    name: Build (server + web)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm build:server

      - name: Build web
        run: pnpm build:web

  # 微信小程序自动发布（上传体验版）
  # 前置条件：
  #   1. 仓库 Secrets 配置 WEAPP_APPID 与 WEAPP_PRIVATE_KEY（mp 后台"小程序代码上传"密钥全文）
  #   2. mp.weixin.qq.com → 开发管理 → 开发设置 → 小程序代码上传：关闭 IP 白名单
  # 说明：miniprogram-ci 只能自动到"上传体验版"，提交审核与线上发布需在 mp 后台人工确认
  publish-weapp:
    name: Publish WeApp (体验版)
    runs-on: ubuntu-latest
    needs: [validate, test-server, test-web, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write upload key
        run: |
          mkdir -p key
          printf '%s' "$WEAPP_PRIVATE_KEY" > key/private.appid.key
        env:
          WEAPP_PRIVATE_KEY: ${{ secrets.WEAPP_PRIVATE_KEY }}

      - name: Build weapp
        run: pnpm build:weapp
        env:
          TARO_APP_WEAPP_APPID: ${{ secrets.WEAPP_APPID }}

      # plugin-mini-ci 的独立 upload 命令：上传 dist/ 为体验版
      - name: Upload to WeChat
        run: pnpm upload:weapp
        env:
          TARO_APP_WEAPP_APPID: ${{ secrets.WEAPP_APPID }}
