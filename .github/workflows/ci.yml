name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的并发运行只保留最新一次，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 依赖安装与锁文件校验（其余 job 依赖它）
  setup:
    name: Setup & Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false # 版本由 package.json 的 packageManager (pnpm@9.0.0) 决定

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm # 缓存 pnpm store（基于 pnpm-lock.yaml）

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # lint + 类型检查
  validate:
    name: Validate (lint + tsc)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validate
        run: pnpm validate

  # 后端 Jest（NestJS + better-sqlite3 原生模块）
  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    needs: setup
    env:
      # 跳过 StockService 启动时的 Sina 目录预热（e2e-flow 未自行设置 NODE_ENV）
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run server tests
        working-directory: server
        # --ci：失败即红，不进入 watch / 交互模式；--coverage：采集覆盖率并执行 coverageThreshold 门禁
        run: pnpm test -- --ci --coverage

      - name: Upload server coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-server
          path: server/coverage
          retention-days: 14

  # 前端 Jest（jsdom）
  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web tests
        # --coverage：采集覆盖率并执行 coverageThreshold 门禁（本地默认 pnpm test:web 不采集，避免拖慢）
        run: pnpm test:web --ci --coverage

      - name: Upload web coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: coverage
          retention-days: 14

  # 构建产物校验
  build:
    name: Build (server + web)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm build:server

      - name: Build web
        run: pnpm build:web
